name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system libraries (Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libfreetype6 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libglib2.0-0 dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Generate icons
        run: python scripts/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/Jobwise.spec

      - name: Build .deb
        run: |
          bash packaging/linux/build_deb.sh
          ls -la dist/*.deb

      - name: Install the package and launch it (self-test)
        run: |
          sudo apt-get install -y ./dist/Jobwise-Linux-amd64.deb
          test -x /usr/bin/jobwise
          test -f /usr/share/applications/jobwise.desktop
          jobwise --version
          jobwise --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: Jobwise-Linux-amd64
          path: dist/Jobwise-Linux-amd64.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Generate icons
        run: python scripts/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/Jobwise.spec

      - name: Self-test the built application
        run: |
          .\dist\Jobwise\Jobwise.exe --version
          $p = Start-Process -FilePath ".\dist\Jobwise\Jobwise.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = python -c "import resume_matcher; print(resume_matcher.__version__)"
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist\*.exe

      - name: Silent install and launch the installed app (self-test)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "jobwise-install"
          $p = Start-Process -FilePath ".\dist\Jobwise-Windows-x64.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer failed: $($p.ExitCode)" }
          $app = Join-Path $dir "Jobwise.exe"
          if (-not (Test-Path $app)) { throw "installed executable missing" }
          $t = Start-Process -FilePath $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "installed app selftest failed: $($t.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Jobwise-Windows-x64
          path: dist/Jobwise-Windows-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Jobwise-Windows-x64.exe
            release/Jobwise-Linux-amd64.deb
          generate_release_notes: true
